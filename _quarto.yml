project:
  type: website
  output-dir: docs
  resources: 
    - "library"
  render:
    - "*.qmd"
    - "!article.qmd"
    - "!analysis.qmd"

website:
  title: "Experimento de maiz"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: labels.qmd
        text: Labeling
      - href: files/phenomics.qmd
        text: Phenomics
      - href: analysis.qmd
        text: Data Analysis
      - href: article.qmd
        text: Articles & Tools
    right:
      - icon: github
        href: https://github.com/Flavjack/inti

format:
  html:
    theme: cosmo
    toc: true
    toc-title: "Contenido"
    toc-location: right
    code-fold: true
    code-summary: "Mostrar código R"
    smooth-scroll: true

execute:
  echo: true
  eval: true
  output: true
  warning: false
  message: false